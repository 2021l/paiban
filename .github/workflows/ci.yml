name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 运行测试
        run: python -m pytest

      - name: 演示页引擎测试（Node）
        run: node --test tests/engine.test.cjs

      - name: 命令行冒烟测试
        run: |
          printf '使用Python编写\n' | python -m paiban
          printf '使用Python编写\n' | python -m paiban --check || test $? -eq 1
