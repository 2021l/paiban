name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest 已升到 26.04，setup-python 不再提供 Python 3.9 的预编译包，
        # 所以 3.9 固定跑在 22.04 上；其余版本用最新镜像。
        include:
          - { os: ubuntu-22.04, python-version: "3.9" }
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: ubuntu-latest, python-version: "3.13" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: 运行测试
        run: python -m pytest

      - name: 演示页引擎测试（Node）
        run: node --test tests/engine.test.cjs

      - name: 命令行冒烟测试
        run: |
          printf '使用Python编写\n' | python -m paiban
          printf '使用Python编写\n' | python -m paiban --check || test $? -eq 1
