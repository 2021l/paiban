name: Release Windows EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 打包 Windows 可执行文件
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyinstaller

      - name: 运行测试
        run: python -m pytest

      - name: 打包 onefile
        run: >
          python -m PyInstaller --noconfirm --clean --onefile
          --name paiban --paths src packaging/paiban_win.py

      - name: 冒烟测试
        run: |
          .\dist\paiban.exe --version
          python -c "print('使用Python编写')" | .\dist\paiban.exe

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: paiban-windows-x64
          path: dist/paiban.exe

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/paiban.exe
          generate_release_notes: true
